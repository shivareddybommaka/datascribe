name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Throwaway DB for API integration tests (synthetic data only). Name must end in _test.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datascribe
          POSTGRES_PASSWORD: datascribe
          POSTGRES_DB: datascribe_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U datascribe"
          --health-interval 5s
          --health-retries 10
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://datascribe:datascribe@localhost:5433/datascribe_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Local S3 for the upload tests (SeaweedFS, D-014). Not a service container: it needs a command.
      - name: Start S3 (SeaweedFS)
        run: >-
          docker run -d --name s3 -p 127.0.0.1:9000:8333
          -e AWS_ACCESS_KEY_ID=datascribe -e AWS_SECRET_ACCESS_KEY=datascribe-dev-secret
          chrislusf/seaweedfs:latest server -dir=/data -s3 -s3.port=8333
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Wait for S3
        run: timeout 90 bash -c 'until curl -s -o /dev/null http://127.0.0.1:9000; do sleep 2; done'
      - run: pnpm test
      - run: pnpm build
