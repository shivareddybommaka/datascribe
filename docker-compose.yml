name: datascribe

# Images are pinned by digest (audit L12, D-109): a re-pushed tag can't change what runs.
# The tag stays for readability; to update, pull the tag and copy its RepoDigest here.
services:
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: datascribe
      POSTGRES_PASSWORD: datascribe
      POSTGRES_DB: datascribe
    ports:
      # 5433 on the host: 5432 belongs to another system on the dev Mac (D-011). Localhost only.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U datascribe']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Local S3. MinIO no longer publishes community images (D-014), so SeaweedFS's S3 gateway is used.
  s3:
    image: chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # Each bucket (one set per checkout and test run) gets volumes of its own; the default limit of
    # 8 volumes ran out with parallel worktrees. Small volumes, many of them (files are sparse).
    command: server -dir=/data -volume.max=200 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-datascribe}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-datascribe-dev-secret}
    ports:
      - '127.0.0.1:9000:8333'
    volumes:
      - s3data:/data

  mailpit:
    image: axllent/mailpit:latest@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  # Virus scanning (M4). Opt-in: docker compose --profile scan up -d
  # clamav-debian: the official image with an arm64 build (clamav/clamav is amd64-only, so it
  # wouldn't start on the Mac Studio). Pinned by multi-arch index digest (audit L12).
  clamav:
    image: clamav/clamav-debian:stable@sha256:d7ede3cefeaf3b8a72ebcdee849d13f504bbca3f3b3cfade5bc7b6ee06a4f62c
    profiles: ['scan']
    ports:
      - '127.0.0.1:3310:3310'

volumes:
  pgdata:
  s3data:
