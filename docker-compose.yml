name: datascribe

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datascribe
      POSTGRES_PASSWORD: datascribe
      POSTGRES_DB: datascribe
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U datascribe']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-datascribe}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-datascribe-dev-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  # Virus scanning (M4). Opt-in: docker compose --profile scan up -d
  clamav:
    image: clamav/clamav:stable
    profiles: ['scan']
    ports:
      - '3310:3310'

volumes:
  pgdata:
  miniodata:
